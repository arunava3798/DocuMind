<div class="app-shell">
  <header class="topbar">
    <h1><img src="favicon.svg" alt="" class="logo" /> DocuMind</h1>
    <button
      class="clear-chat"
      (click)="clearChat()"
      [disabled]="!chatRef()?.messages()?.length"
      title="Clear the conversation history"
    >
      ↺ New chat
    </button>
  </header>

  <main class="layout">
    <aside class="sidebar">
      <app-document-manager />
    </aside>
    <div class="main-chat">
      <app-chat />
    </div>
  </main>
</div>
